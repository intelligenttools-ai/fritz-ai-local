<!DOCTYPE html>
<!--
  Fritz Local Brain — Agents page (#220 app shell).
  Per-agent section with the #199 drill-down (agent-filter selector scopes the
  summary / queries / projects panels), plus a per-agent detail drill-down
  (#224: agent cards -> GET /v1/usage/agents/{agent}), deep-linkable via
  ?agent=<name> with browser back/forward support. Recent events that
  reference a run cross-link to the Operations run detail.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fritz Brain — Agents</title>
<link rel="icon" type="image/svg+xml" href="/ui/shared/favicon.svg">
<link rel="stylesheet" href="/ui/shared/app.css">
</head>
<body data-page="agents">

<div id="loading"></div>

<div id="auth-overlay">
  <div id="auth-box">
    <h2>Fritz Brain Dashboard</h2>
    <p>Enter the API Bearer token to load usage data.</p>
    <input type="password" id="token-input" placeholder="Bearer token" autofocus>
    <button onclick="saveToken()">Continue</button>
    <div id="auth-error">Invalid token — please try again.</div>
  </div>
</div>

<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="content">
    <header>
      <h1>Fritz Brain</h1>
      <span class="subtitle">Agents</span>
      <div class="header-controls">
        <button id="theme-toggle" onclick="toggleTheme()" title="Toggle light/dark theme">🌙</button>
        <button id="refresh-btn" onclick="manualRefresh()">Refresh</button>
        <select id="auto-refresh-select" onchange="onIntervalChange()">
          <option value="0">Auto-refresh: off</option>
          <option value="15">Every 15s</option>
          <option value="30" selected>Every 30s</option>
          <option value="60">Every 60s</option>
        </select>
        <select id="agent-filter-select" onchange="onAgentFilterChange()">
          <option value="">All agents</option>
        </select>
        <span id="last-updated"></span>
      </div>
    </header>

    <main>
      <div id="agents-list-view">
        <h2>Agents</h2>
        <div class="section">
          <div class="cards" id="agent-cards">
            <div class="skel-cards"><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></div>
          </div>
        </div>

        <h2>Summary</h2>
        <div class="section">
          <div class="cards" id="summary-cards">
            <div class="skel-cards"><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div><div class="skeleton skel-card"></div></div>
          </div>
        </div>

        <h2>Queries</h2>
        <div class="section grid2">
          <div class="panel">
            <div class="cards" id="query-cards" style="margin-bottom:.85rem">
              <div class="skeleton skel-card"></div>
            </div>
            <div class="latency-row" id="latency-row" style="display:none"></div>
          </div>
          <div class="panel">
            <div class="panel-title">Top queries</div>
            <div id="top-queries-chart"><div class="skeleton skel-line"></div><div class="skeleton skel-line"></div></div>
          </div>
        </div>

        <h2>Projects / Vaults</h2>
        <div class="section panel">
          <div id="projects-table"><div class="skeleton skel-line"></div><div class="skeleton skel-line"></div></div>
        </div>
      </div>

      <div id="agent-detail-view" style="display:none">
        <div class="section panel">
          <button class="back-btn" onclick="backToAgents()">← Back to agents</button>
          <div id="agent-detail"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="chart-tip" id="chart-tip"></div>

<script src="/ui/shared/api.js"></script>
<script src="/ui/shared/sse.js"></script>
<script src="/ui/shared/nav.js"></script>
<script>
// Agents page: the #199 per-agent drill-down. Empty string = "All agents".
// The agent list is discovered dynamically from /v1/usage/agents — never a
// hardcoded enum. The selected agent scopes the summary / queries / projects.

let _agentFilter = "";

/** Build the agent param map for agent-scoped panels (empty when "All agents"). */
function agentParams() {
  return _agentFilter ? { agent: _agentFilter } : {};
}

/** Populate the agent selector from the live /v1/usage/agents discovery list. */
function populateAgentFilter(data) {
  const sel = document.getElementById("agent-filter-select");
  if (!sel) return;
  const agents = (data && Array.isArray(data.agents)) ? data.agents : [];
  // esc() every agent id — telemetry-stored, untrusted (stored XSS guard).
  let html = '<option value="">All agents</option>';
  for (const a of agents) {
    const id = esc(a.agent);
    html += `<option value="${id}">${id} (${a.count ?? 0})</option>`;
  }
  sel.innerHTML = html;
  const present = agents.some(a => a.agent === _agentFilter);
  if (_agentFilter && !present) _agentFilter = "";
  sel.value = _agentFilter;
}

function onAgentFilterChange() {
  _agentFilter = document.getElementById("agent-filter-select").value;
  loadAll();
}

/** Agent cards (#224): one clickable card per agent -> per-agent drill-down.
 * data-agent carries the target (delegated click handler) — never inline
 * onclick with interpolated data. */
function renderAgentCards(data) {
  const el = document.getElementById("agent-cards");
  if (data === null) { renderError("agent-cards", "Could not load agents."); return; }
  const agents = (data && Array.isArray(data.agents)) ? data.agents : [];
  if (!agents.length) {
    el.innerHTML = '<div class="no-data">No agents recorded yet.</div>';
    return;
  }
  el.innerHTML = agents.map(a => {
    const id = esc(a.agent);
    return `<div class="card agent-card" data-agent="${id}">
      <div class="label">${id}</div>
      <div class="value">${a.count ?? 0}</div>
      <div class="agent-card-meta">last seen ${esc(a.last_seen || "—")}</div>
    </div>`;
  }).join("");
}

function renderSummary(data) {
  if (!data) { renderError("summary-cards", "Could not load summary."); return; }
  const eventsSpark   = Array.isArray(data.events_trend)   ? data.events_trend   : null;
  const queriesSpark  = Array.isArray(data.queries_trend)  ? data.queries_trend  : null;
  const articlesSpark = Array.isArray(data.articles_trend) ? data.articles_trend : null;
  renderCards("summary-cards", [
    { label: "Total events",    value: data.total_events ?? 0, spark: eventsSpark,   sparkColor: "var(--accent)" },
    { label: "Total queries",   value: data.total_queries ?? 0, spark: queriesSpark, sparkColor: "var(--accent2)" },
    { label: "Hit rate",        value: pctBadge(data.hit_rate) },
    { label: "Total articles",  value: data.total_articles ?? 0, spark: articlesSpark, sparkColor: "var(--green)" },
    { label: "Backlog pending", value: data.backlog_pending ?? 0, cls: (data.backlog_pending ?? 0) > 0 ? "yellow" : "green" },
    { label: "Distinct agents", value: data.distinct_agents ?? 0 },
  ]);
}

function renderQueries(data) {
  if (!data) {
    renderError("query-cards", "Could not load queries.");
    document.getElementById("latency-row").style.display = "none";
    document.getElementById("top-queries-chart").innerHTML = '<div class="no-data">No data.</div>';
    return;
  }

  renderCards("query-cards", [
    { label: "Total queries", value: data.total ?? 0 },
    { label: "Hit rate", value: pctBadge(data.hit_rate) },
  ]);

  const lat = data.latency_ms || {};
  const latRow = document.getElementById("latency-row");
  if (lat.p50 != null || lat.p95 != null || lat.p99 != null) {
    latRow.style.display = "flex";
    latRow.innerHTML = [
      { label: "p50", v: lat.p50 },
      { label: "p95", v: lat.p95 },
      { label: "p99", v: lat.p99 },
    ].map(l => `<div class="lat-card">
      <div class="label">${l.label}</div>
      <div class="value">${fmtMs(l.v)}</div>
    </div>`).join("");
  } else {
    latRow.style.display = "none";
  }

  const top = data.top_queries || [];
  renderBarChart("top-queries-chart", top.map(q => ({ label: q.query, count: q.count })));

  const byAgent = data.by_agent ? Object.entries(data.by_agent).sort((a,b) => b[1]-a[1]) : [];
  if (byAgent.length) {
    const existing = document.getElementById("query-by-agent");
    const container = existing || (() => {
      const d = document.createElement("div");
      d.id = "query-by-agent";
      d.style.marginTop = ".85rem";
      document.getElementById("query-cards").after(d);
      return d;
    })();
    container.innerHTML = `<div class="panel-title">Queries by agent</div>`;
    const tmpId = "qa-inner-" + Date.now();
    container.innerHTML += `<div id="${tmpId}"></div>`;
    renderBarChart(tmpId, byAgent.map(([k,v]) => ({ label: k, count: v })));
  }
}

function renderProjects(data) {
  const el = document.getElementById("projects-table");
  if (data === null) { renderError("projects-table", "Could not load projects."); return; }
  const projects = data ? (data.projects || []) : [];
  if (!projects.length) {
    el.innerHTML = '<div class="no-data">No project data yet.</div>';
    return;
  }
  const rows = projects.map(p => {
    const typeSummary = Object.entries(p.events_by_type || {})
      .sort((a,b) => b[1]-a[1]).slice(0,3)
      .map(([k,v]) => `${esc(k)}:${v}`).join(", ") || "—";
    return `<tr>
      <td>${esc(p.vault)}</td>
      <td class="num">${p.event_count}</td>
      <td class="num">${p.article_count}</td>
      <td style="color:var(--muted)">${typeSummary}</td>
    </tr>`;
  }).join("");
  el.innerHTML = `<table>
    <thead><tr><th>Vault</th><th class="num">Events</th><th class="num">Articles</th><th>Top event types</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

// ---- per-agent detail drill-down (#224) --------------------------------------
//
// Deep-linkable at ?agent=<name>, backed by GET /v1/usage/agents/{agent}.
// Recent-events rows whose run_id is set cross-link to the Operations run
// detail (/ui/operations?run=<id>) — a real page navigation, not SPA routing.

const AGENT_EVENTS_LIMIT = 20;
let _currentAgent = "";
let _agentEventsOffset = 0;
let _stateApplied = false;

/** Read the current URL query into { agent }. */
function readQuery() {
  const p = new URLSearchParams(window.location.search);
  return { agent: p.get("agent") || "" };
}

/** Reflect a view into the URL (push = new history entry; replace otherwise). */
function writeQuery(state, push) {
  const p = new URLSearchParams();
  if (state.agent) p.set("agent", state.agent);
  const qs = p.toString();
  const url = window.location.pathname + (qs ? "?" + qs : "");
  if (push) history.pushState(state, "", url);
  else history.replaceState(state, "", url);
}

function showAgentsListView() {
  document.getElementById("agents-list-view").style.display = "";
  document.getElementById("agent-detail-view").style.display = "none";
}

function showAgentDetailView() {
  document.getElementById("agents-list-view").style.display = "none";
  document.getElementById("agent-detail-view").style.display = "";
}

/** Render one agent's full detail: header cards, event-type breakdown, daily
 * activity chart, and a paginated recent-events list. */
function renderAgentDetail(d) {
  const el = document.getElementById("agent-detail");
  el.innerHTML = `
    <h2 style="font-size:1.1rem;color:var(--accent);margin-bottom:.6rem">${esc(d.agent)}</h2>
    <div class="cards" id="agent-detail-cards"></div>
    <div class="section grid2" style="margin-top:1rem">
      <div class="panel">
        <div class="panel-title">Event types</div>
        <div id="agent-detail-types"></div>
      </div>
      <div class="panel">
        <div class="panel-title">Daily activity</div>
        <div id="agent-detail-chart"></div>
      </div>
    </div>
    <div class="section panel" style="margin-top:1rem">
      <div class="panel-title">Recent events</div>
      <div id="agent-detail-events"></div>
      <div class="agent-events-pager">
        <button class="back-btn" onclick="pageAgentEvents(-1)" ${d.offset > 0 ? "" : "disabled"}>← Prev</button>
        <span>${Math.min(d.offset + 1, d.event_count)}–${Math.min(d.offset + d.limit, d.event_count)} of ${d.event_count}</span>
        <button class="back-btn" onclick="pageAgentEvents(1)" ${d.offset + d.limit < d.event_count ? "" : "disabled"}>Next →</button>
      </div>
    </div>`;

  renderCards("agent-detail-cards", [
    { label: "Total events", value: d.event_count ?? 0 },
    { label: "First seen", value: esc(d.first_seen || "—") },
    { label: "Last seen", value: esc(d.last_seen || "—") },
  ]);

  const typeItems = Object.entries(d.events_by_type || {})
    .sort((a, b) => b[1] - a[1])
    .map(([k, v]) => ({ label: k, count: v }));
  renderBarChart("agent-detail-types", typeItems);

  const buckets = {};
  for (const [day, n] of Object.entries(d.daily_activity || {})) buckets[day] = { events: n };
  renderTimeChart("agent-detail-chart", buckets);

  renderAgentEvents(Array.isArray(d.recent_events) ? d.recent_events : []);
}

/** Recent-events table. run_id, when set, cross-links to the Operations run
 * detail — a real <a> navigation (not a delegated data-* click), so both
 * encodeURIComponent (URL correctness) and esc() (attribute-context safety)
 * guard the interpolated id. */
function renderAgentEvents(events) {
  const el = document.getElementById("agent-detail-events");
  if (!events.length) { el.innerHTML = '<div class="no-data">No events yet.</div>'; return; }
  const rows = events.map(e => {
    const runLink = e.run_id
      ? `<a href="/ui/operations?run=${esc(encodeURIComponent(e.run_id))}">${esc(String(e.run_id).slice(0, 8))}</a>`
      : "—";
    return `<tr>
      <td>${esc(e.ts || "")}</td>
      <td>${esc(e.event_type || "")}</td>
      <td>${esc(e.vault || "")}</td>
      <td>${esc(e.status || "")}</td>
      <td class="num">${fmtMs(e.duration_ms)}</td>
      <td>${runLink}</td>
    </tr>`;
  }).join("");
  el.innerHTML = `<table>
    <thead><tr><th>Time</th><th>Type</th><th>Vault</th><th>Status</th><th class="num">Duration</th><th>Run</th></tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function fetchAndRenderAgentDetail(push) {
  const data = await apiFetch(`/v1/usage/agents/${encodeURIComponent(_currentAgent)}`, {
    limit: AGENT_EVENTS_LIMIT,
    offset: _agentEventsOffset,
  });
  if (!data) { renderError("agent-detail", "Could not load agent."); return; }
  if (push) writeQuery({ agent: _currentAgent }, true);
  renderAgentDetail(data);
}

async function loadAgent(agent, push = true) {
  _currentAgent = agent;
  _agentEventsOffset = 0;
  showAgentDetailView();
  await fetchAndRenderAgentDetail(push);
}

async function pageAgentEvents(direction) {
  const next = _agentEventsOffset + direction * AGENT_EVENTS_LIMIT;
  if (next < 0) return;
  _agentEventsOffset = next;
  await fetchAndRenderAgentDetail(false);
}

function backToAgents() {
  showAgentsListView();
  writeQuery({}, true);
}

/** Apply a URL state to the view (no history push — this IS the navigation). */
async function applyState(state) {
  if (state.agent) {
    await loadAgent(state.agent, false);
  } else {
    showAgentsListView();
  }
}

// Browser back/forward.
window.addEventListener("popstate", () => { applyState(readQuery()); });

// Agent cards: delegated click listener (survives the innerHTML re-render).
let _delegatesBound = false;
function bindDelegates() {
  if (_delegatesBound) return;
  _delegatesBound = true;
  document.getElementById("agent-cards").addEventListener("click", (e) => {
    const card = e.target.closest(".agent-card");
    if (card && card.dataset.agent) loadAgent(card.dataset.agent);
  });
}

async function loadAll() {
  bindDelegates();
  if (_inFlight) return;
  _inFlight = true;
  document.getElementById("last-updated").textContent = "Loading…";

  // Agent-scoped panels get agent=_agentFilter when a specific agent is selected.
  // The agents discovery list is always global so the selector shows every agent.
  const ap = agentParams();
  const [agents, summary, queries, projects] = await Promise.all([
    apiFetch("/v1/usage/agents"),
    apiFetch("/v1/usage/summary", ap),
    apiFetch("/v1/usage/queries", ap),
    apiFetch("/v1/usage/projects", ap),
  ]);

  _inFlight = false;
  if (!getToken()) return;

  populateAgentFilter(agents);
  renderAgentCards(agents);
  renderSummary(summary);
  renderQueries(queries);
  renderProjects(projects);

  _lastUpdatedAt = new Date();
  renderLastUpdated();

  if (!_stateApplied) {
    _stateApplied = true;
    await applyState(readQuery());
  }
}
</script>
</body>
</html>
